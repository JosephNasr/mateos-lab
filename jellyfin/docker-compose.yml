  # ---------- Streaming server ----------
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - JELLYFIN_PublishedServerUrl=http://${PI_IP}:8096
    volumes:
      - ${JELLYFIN_LIBRARY}:/config
      - ${JELLYFIN_TV}:/data/tv
      - ${JELLYFIN_MOVIES}:/data/movies
    ports:
      - "8096:8096"   # HTTP
      # - "8920:8920" # HTTPS (only if you configure certs)
    restart: unless-stopped
    networks:
      - plex_net

