# Jellyfin media stack.
#
# Services:
# - Jellyfin: media streaming
# - Jellyseerr: media requests
# - Prowlarr: indexer manager
# - Sonarr: TV automation
# - Radarr: movie automation
# - qBittorrent: torrent client

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - UMASK=${UMASK}
      - WEBUI_PORT=8080
    volumes:
      - ${APPDATA_DIR}/qbittorrent:/config
      - ${DOWNLOADS_DIR}:/downloads
    ports:
      - "8080:8080"     # Web UI
      - "6881:6881"     # TCP torrent port
      - "6881:6881/udp" # UDP torrent port
    restart: unless-stopped
    networks:
      - plex_net

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLIC_URL}
    volumes:
      - ${APPDATA_DIR}/jellyfin:/config
      - ${TV_DIR}:/data/tv
      - ${MOVIES_DIR}:/data/movies
    ports:
      - "8096:8096"
      # Optional HTTPS if certificates are configured in Jellyfin:
      # - "8920:8920"
      # Optional hardware transcoding for supported Linux hosts:
      # devices:
      #   - /dev/dri:/dev/dri
    restart: unless-stopped
    networks:
      - plex_net
      - web

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - TZ=${TIMEZONE}
      - LOG_LEVEL=info
    volumes:
      - ${APPDATA_DIR}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    networks:
      - plex_net
      - web
    depends_on:
      - jellyfin

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${APPDATA_DIR}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - plex_net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - UMASK=${UMASK}
    volumes:
      - ${APPDATA_DIR}/sonarr:/config
      - ${TV_DIR}:/tv
      - ${DOWNLOADS_DIR}:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - plex_net
    depends_on:
      - qbittorrent

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - UMASK=${UMASK}
    volumes:
      - ${APPDATA_DIR}/radarr:/config
      - ${MOVIES_DIR}:/movies
      - ${DOWNLOADS_DIR}:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - plex_net
    depends_on:
      - qbittorrent

networks:
  plex_net:
    driver: bridge
  web:
    external: true
