# docker-compose.yml
#
# Media request + automation + torrent download + streaming + LAN file sharing (SMB)
# Stack:
# - Overseerr (requests)
# - Prowlarr (indexers manager)
# - Sonarr (TV automation)
# - Radarr (Movies automation)
# - qBittorrent (torrent client)
# - Jellyfin (streaming UI for Google TV)  [VLC can also use SMB share]
# - Samba (SMB share so VLC on Google TV can browse/play files)
#
# Prereqs on the Pi:
#   1) Install Docker + Docker Compose plugin
#   2) Create folders listed below
#   3) Create a .env file (template below)
#
# Recommended storage:
#   Use an SSD and mount it at /srv (or change paths in .env)
#
# Create folders (example):
#   sudo mkdir -p /srv/media/{movies,tv} /srv/downloads/{incomplete,complete} /srv/appdata/{qbittorrent,prowlarr,sonarr,radarr,overseerr,jellyfin,samba}
#   sudo chown -R $USER:$USER /srv/media /srv/downloads /srv/appdata
#
# Then:
#   docker compose up -d
#
# Web UIs:
#   Overseerr:  http://PI_IP:5055
#   Prowlarr:   http://PI_IP:9696
#   Sonarr:     http://PI_IP:8989
#   Radarr:     http://PI_IP:7878
#   qBittorrent:http://PI_IP:8080
#   Jellyfin:   http://PI_IP:8096
#
# Google TV:
#   - Jellyfin app: add server PI_IP:8096
#   - VLC via SMB: browse \\PI_IP\media (credentials in .env)

