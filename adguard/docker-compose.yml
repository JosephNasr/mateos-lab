name: adguard

services:
  adguardhome:
    # Update this exact release deliberately, then run `make update STACK=adguard`.
    image: adguard/adguardhome:v0.107.76
    container_name: adguardhome
    restart: unless-stopped

    labels:
      diun.watch_repo: "true"
      diun.sort_tags: semver
      diun.include_tags: '^v0\.[0-9]+\.[0-9]+$'
      diun.max_tags: "1"

    user: "${ADGUARD_UID:-1000}:${ADGUARD_GID:-1000}"

    ports:
      # DNS
      - "53:53/tcp"
      - "53:53/udp"

      # Initial setup wizard (not needed after setup)
      # - "3000:3000/tcp"

      # Admin web UI after setup
      - "8081:80/tcp"

    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
