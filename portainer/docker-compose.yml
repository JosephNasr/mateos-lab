services:
  portainer:
    # Update this exact LTS release deliberately, then run `make update STACK=portainer`.
    image: portainer/portainer-ce:2.45.0
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"   # UI (HTTPS)
      # - "8000:8000"   # agent/tunnel port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    networks: [web]
    
networks:
  web:
    external: true
