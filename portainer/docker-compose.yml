name: portainer

services:
  portainer:
    # Update this exact LTS release deliberately, then run `make update STACK=portainer`.
    image: portainer/portainer-ce:2.45.0
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"   # UI (HTTPS)
      # - "8000:8000"   # agent/tunnel port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data

    labels:
      diun.watch_repo: "true"
      diun.sort_tags: semver
      diun.include_tags: '^2\.[0-9]+\.[0-9]+$'
      diun.max_tags: "1"

    networks: [web]
    
networks:
  web:
    external: true
