title: Docker Observability
views:
  - title: Containers
    path: containers
    icon: mdi:docker
    cards:
      - type: entities
        title: Docker Host
        show_header_toggle: false
        entities:
          - entity: sensor.docker_containers_running
            name: Running containers
          - entity: sensor.docker_containers_stopped
            name: Stopped containers
          - entity: sensor.docker_containers_total
            name: Total containers
          - entity: sensor.docker_1cpu
            name: Docker CPU

      - type: entities
        title: Container Status
        show_header_toggle: false
        entities:
          - entity: sensor.docker_adguardhome_state
            name: AdGuard Home
          - entity: sensor.docker_n8n_state
            name: n8n
          - entity: sensor.docker_homeassistant_state
            name: Home Assistant
          - entity: sensor.docker_twingate_state
            name: Twingate
          - entity: sensor.docker_cloudflared_state
            name: Cloudflared
          - entity: sensor.docker_portainer_state
            name: Portainer
          - entity: sensor.docker_jellyfin_state
            name: Jellyfin
          - entity: sensor.docker_sonarr_state
            name: Sonarr
          - entity: sensor.docker_radarr_state
            name: Radarr
          - entity: sensor.docker_prowlarr_state
            name: Prowlarr
          - entity: sensor.docker_bazarr_state
            name: Bazarr
          - entity: sensor.docker_seerr_state
            name: Seerr
          - entity: sensor.docker_qbittorrent_state
            name: qBittorrent
          - entity: sensor.docker_transmission_state
            name: Transmission
          - entity: sensor.docker_flaresolverr_state
            name: FlareSolverr
          - entity: sensor.docker_shelfmark_state
            name: Shelfmark
          - entity: sensor.docker_calibre_web_automated_state
            name: Calibre-Web Automated
          - entity: sensor.docker_api_state
            name: API
          - entity: sensor.docker_mosquitto_state
            name: Mosquitto

      - type: entities
        title: Core Container Metrics
        show_header_toggle: false
        entities:
          - entity: sensor.docker_adguardhome_health
            name: AdGuard health
          - entity: sensor.docker_adguardhome_1cpu
            name: AdGuard CPU
          - entity: sensor.docker_n8n_health
            name: n8n health
          - entity: sensor.docker_n8n_1cpu
            name: n8n CPU
          - entity: sensor.docker_twingate_health
            name: Twingate health
          - entity: sensor.docker_cloudflared_1cpu
            name: Cloudflared CPU
