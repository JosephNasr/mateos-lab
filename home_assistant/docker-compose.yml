# docker-compose.yml (Raspberry Pi 5 / Raspberry Pi OS)
#
# Goals:
# - Maximum LAN discovery + access to devices on your network (mDNS/SSDP/UPnP/broadcast)
# - Good baseline permissions for hardware/network integrations
# - Optional local-first building blocks (MQTT now, Zigbee later)

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host
    privileged: true
    restart: unless-stopped

    environment:
      - TZ=${TIMEZONE}
      - PI_IP=${PI_IP}

    volumes:
      - ./ha/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

    # Optional (recommended): keep container logs from growing forever
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # Recommended even if you’re not using Zigbee yet:
  # MQTT becomes useful for many “local-first” paths later (Zigbee2MQTT, ESPHome, Tasmota, etc.)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001" # optional websockets
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


