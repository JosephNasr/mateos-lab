name: uptime_kuma

services:
  socket-proxy:
    # Locked to the currently deployed build; update deliberately after DIUN alerts.
    image: lscr.io/linuxserver/socket-proxy:3.4.4-r0-ls97
    container_name: uptime-kuma-socket-proxy
    restart: unless-stopped

    environment:
      CONTAINERS: "1"
      INFO: "1"
      VERSION: "1"
      POST: "0"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    read_only: true

    labels:
      diun.watch_repo: "true"
      diun.sort_tags: semver
      diun.include_tags: '^[0-9]+.*-ls[0-9]+$'
      diun.max_tags: "1"

    tmpfs:
      - /run

    networks:
      - docker_proxy

  uptime-kuma:
    # Uptime Kuma's installed `:2` image has no embedded release version.
    # The digest is therefore the exact, reproducible pin for this deployment.
    image: louislam/uptime-kuma:2@sha256:917318f9d7be5257f43ba412c766a473be336eb451d70744f3b482d0c3997c0e
    container_name: uptime-kuma
    restart: unless-stopped

    depends_on:
      - socket-proxy

    ports:
      - "3001:3001"

    volumes:
      - ./data:/app/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - default
      - docker_proxy
      - web

    labels:
      diun.watch_repo: "true"
      diun.sort_tags: semver
      diun.include_tags: '^2\.[0-9]+\.[0-9]+$'
      diun.max_tags: "1"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  docker_proxy:
    internal: true

  web:
    external: true
