name: twingate

services:
  twingate:
    # The installed `:1` image has no embedded release version. Lock its digest
    # and advance it deliberately after DIUN reports a new stable 1.x release.
    image: twingate/connector:1@sha256:b7049dbf2c105c837cd0cd199fb4d07b1799e45a6de2481bcfc4e0fb51074539
    container_name: twingate
    restart: unless-stopped

    labels:
      diun.watch_repo: "true"
      diun.sort_tags: semver
      diun.include_tags: '^1\.[0-9]+\.[0-9]+$'
      diun.max_tags: "1"

    environment:
      - TWINGATE_NETWORK=${TWINGATE_NETWORK}
      - TWINGATE_ACCESS_TOKEN=${TWINGATE_ACCESS_TOKEN}
      - TWINGATE_REFRESH_TOKEN=${TWINGATE_REFRESH_TOKEN}
      - TWINGATE_LABEL_HOSTNAME=${TWINGATE_LABEL_HOSTNAME}

    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
