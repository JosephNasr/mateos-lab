name: cloudflared

services:

  cloudflared:
    container_name: cloudflared
    # Update this exact release deliberately, then run `make update STACK=cloudflared`.
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped

    labels:
      diun.watch_repo: "true"
      diun.sort_tags: semver
      diun.include_tags: '^20[0-9]{2}\.[0-9]+\.[0-9]+$'
      diun.max_tags: "1"

    command: tunnel run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cloudflared:/etc/cloudflared
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks: [web]

networks:
  web:
    external: true
