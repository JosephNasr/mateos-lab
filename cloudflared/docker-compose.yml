name: cloudflared

services:

  cloudflared:
    container_name: cloudflared
    # Update this exact release deliberately, then run `make update STACK=cloudflared`.
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    command: tunnel run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cloudflared:/etc/cloudflared
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks: [web]

networks:
  web:
    external: true
