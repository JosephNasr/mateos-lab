name: ntfy

services:
  ntfy:
    container_name: ntfy
    # Update this exact release deliberately, then run `make update STACK=ntfy`.
    image: binwiederhier/ntfy:v2.28.0
    command: serve
    restart: unless-stopped
    init: true

    environment:
      TZ: ${TIMEZONE}
      NTFY_BASE_URL: ${NTFY_BASE_URL:?Set NTFY_BASE_URL in the root .env}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_BEHIND_PROXY: "true"
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT: 1G
      NTFY_ENABLE_LOGIN: "true"
      NTFY_REQUIRE_LOGIN: "true"
      # Relays only poll metadata through ntfy.sh so iOS can wake and fetch the
      # actual message from this server.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh

    ports:
      - "8082:80"

    volumes:
      - ./data:/var/lib/ntfy

    networks:
      - web

    labels:
      diun.watch_repo: "true"
      diun.sort_tags: semver
      diun.include_tags: '^v2\.[0-9]+\.[0-9]+$'
      diun.max_tags: "1"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
