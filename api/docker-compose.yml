name: api

services:
  api:
    container_name: api
    build: .
    expose:
      - "4211"
    networks: [web]
    environment:
      - GENERIC_TIMEZONE=${TIMEZONE}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4211/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  web:
    external: true
